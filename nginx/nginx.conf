upstream users { server user-service:8000; }
upstream products { server product-service:8000; }
upstream orders { server order-service:8000; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","proxy":"nginx"}';
    }
    location /api/users/ {
        proxy_pass http://users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/products/ {
        proxy_pass http://products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders/ {
        proxy_pass http://orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        default_type text/plain;
        return 200 'AWS Microservices demo is running. Try /api/users/, /api/products/, /api/orders/.';
    }
}
